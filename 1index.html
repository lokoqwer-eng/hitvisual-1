```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL LUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&display=swap');
        
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .unbounded { font-family: 'Unbounded', sans-serif; }

        .header {
            padding: 25px 0;
            text-align: center;
        }

        .canvas-container {
            flex: 1;
            margin: 0 20px;
            background: #111;
            border: 1px solid #222;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #result-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .ui-panel {
            background: #0a0a0a;
            padding: 30px 20px calc(30px + env(safe-area-inset-bottom));
            border-radius: 40px 40px 0 0;
            border-top: 1px solid #1a1a1a;
        }

        .input-box {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 18px 25px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 16px;
        }

        .btn-generate {
            background: #fff;
            color: #000;
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            font-family: 'Unbounded';
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .btn-generate:active { transform: scale(0.98); opacity: 0.8; }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00f2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-text {
            font-family: 'Unbounded';
            font-size: 10px;
            letter-spacing: 3px;
            opacity: 0.2;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="unbounded text-[10px] tracking-[0.5em] opacity-40">HIT VISUAL LUX</div>
    </div>

    <div class="canvas-container">
        <div class="loader" id="loader"></div>
        <div id="status" class="status-text">AI Canvas Ready</div>
        <img id="result-image" src="" alt="Результат">
    </div>

    <div class="ui-panel">
        <div class="input-box">
            <input type="text" id="prompt-input" placeholder="Опишите ваш шедевр...">
        </div>
        <button id="main-button" onclick="handleGeneration()" class="btn-generate">Генерировать</button>
    </div>

    <script>
        const apiKey = ""; // Ключ будет предоставлен средой

        async function handleGeneration() {
            const prompt = document.getElementById('prompt-input').value;
            if (!prompt) return;

            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const img = document.getElementById('result-image');
            const btn = document.getElementById('main-button');

            // UI loading state
            loader.style.display = 'block';
            status.style.display = 'none';
            img.style.display = 'none';
            btn.innerText = "Рисуем...";
            btn.disabled = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });

                const data = await response.json();
                
                if (data.predictions && data.predictions[0]) {
                    const base64Data = data.predictions[0].bytesBase64Encoded;
                    img.src = `data:image/png;base64,${base64Data}`;
                    img.style.display = 'block';
                    loader.style.display = 'none';
                } else {
                    throw new Error("No image data");
                }
            } catch (error) {
                console.error(error);
                status.innerText = "Ошибка генерации";
                status.style.display = 'block';
                loader.style.display = 'none';
            } finally {
                btn.innerText = "Генерировать";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
